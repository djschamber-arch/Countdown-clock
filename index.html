<style>
  :root {
    --bg: #131314;
    --green: #00b35c;
    --blue: #2347a3;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  body {
    display: grid;
    place-items: center;
  }

  /* 16:9 stage, everything inside is sized in % / cqw so it scales like the slide */
  .stage {
    position: relative;
    width: min(100vw, 100vh * 16 / 9);
    aspect-ratio: 2500 / 1406;
    container-type: size;
    background:
      radial-gradient(60% 30% at 38% 100%, rgba(32, 62, 20, .95) 0%, rgba(32, 62, 20, 0) 100%),
      radial-gradient(40% 28% at 100% 100%, rgba(36, 62, 80, .95) 0%, rgba(36, 62, 80, 0) 100%),
      radial-gradient(30% 25% at 0% 100%, rgba(32, 58, 84, .9) 0%, rgba(32, 58, 84, 0) 100%),
      var(--bg);
    overflow: hidden;
  }

  /* Timer box: black fill with a green -> blue gradient border */
  .timer {
    position: absolute;
    left: 7.8%;
    top: 32.9%;
    width: 53.4%;
    height: 30.1%;
    box-sizing: border-box;
    border: 0.14cqw solid transparent;
    border-radius: 2.4cqw;
    background:
      linear-gradient(#000, #000) padding-box,
      linear-gradient(100deg, var(--green) 0%, #0e8f6a 40%, #15698a 70%, var(--blue) 100%) border-box;
    display: grid;
    place-items: center;
  }
  .digits {
    font-family: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
    font-weight: 400;
    font-size: 11.3cqw;
    line-height: 1;
    letter-spacing: 0;
    white-space: pre;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "zero" 1;
    background: linear-gradient(90deg, var(--green) 0%, #0b9068 35%, #14708a 65%, var(--blue) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }

  /* QR card */
  .qr {
    position: absolute;
    left: 66.7%;
    top: 25.2%;
    width: 25.5%;
    aspect-ratio: 1;
    background: #fff;
    border-radius: 2.8cqw;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .qr img {
    width: 88%;
    height: auto;
    display: block;
  }
  .qr-caption {
    position: absolute;
    left: 66.7%;
    top: calc(25.2% + 25.5cqw * 1.0 + 1.9cqw);
    width: 25.5%;
    box-sizing: border-box;
    padding: 0 1cqw;
    text-align: center;
    font-family: "Google Sans", "Roboto", system-ui, sans-serif;
    font-weight: 500;
    font-size: 1.45cqw;
    line-height: 1.35;
    color: #fff;
  }
  .qr .missing {
    display: none;
    width: 79%;
    text-align: center;
    font: 1cqw/1.4 "Roboto", sans-serif;
    color: #555;
  }
  .qr.no-img img { display: none; }
  .qr.no-img .missing { display: block; }

  .tag {
    position: absolute;
    left: 3.7%;
    bottom: 3.1%;
    font-family: "Google Sans", "Roboto", system-ui, sans-serif;
    font-size: 0.95cqw;
    color: #fff;
  }
</style>
</head>

<script>
  // Length: 2 hours by default; override with ?h=1, ?m=90 or ?s=300
  const params = new URLSearchParams(location.search);
  let durationMs = 2 * 60 * 60 * 1000;
  if (params.has("h")) durationMs = parseFloat(params.get("h")) * 3600000;
  if (params.has("m")) durationMs = parseFloat(params.get("m")) * 60000;
  if (params.has("s")) durationMs = parseFloat(params.get("s")) * 1000;

  const el = document.getElementById("digits");
  const pad = n => String(n).padStart(2, "0");

  let remainingMs = durationMs;   // time left while paused
  let endTime = null;             // set while running
  let running = false;

  function currentRemaining() {
    return running ? Math.max(0, endTime - Date.now()) : remainingMs;
  }

  function render() {
    const total = Math.ceil(currentRemaining() / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    el.textContent = h + ":" + pad(m) + ":" + pad(s);
    document.title = el.textContent;
  }

  function start() {
    if (running || remainingMs <= 0) return;
    endTime = Date.now() + remainingMs;
    running = true;
  }
  function pause() {
    if (!running) return;
    remainingMs = Math.max(0, endTime - Date.now());
    running = false;
  }
  function toggle() { running ? pause() : start(); }
  function reset() {
    running = false;
    remainingMs = durationMs;
    render();
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === "Space") {
      e.preventDefault();
      if (!e.repeat) toggle();
    } else if (e.key === "r" || e.key === "R") {
      reset();
    } else if (e.key === "f" || e.key === "F") {
      toggleFullscreen();
    }
  });

  function tick() {
    if (running && endTime - Date.now() <= 0) {
      running = false;
      remainingMs = 0;
    }
    render();
  }
  render();
  setInterval(tick, 100);
</script>
